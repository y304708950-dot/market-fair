<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国市集活动指南 - 发现身边的美好市集</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">集市<span>指南</span></div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索市集名称、地点...">
                <button id="search-btn">搜索</button>
            </div>
            <div class="submit-btn">
                <a href="mailto:submit@market-guide.com?subject=提交市集活动">提交市集</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>探索全国精彩市集</h1>
            <p>发现农夫市集、创意市集、复古市集、美食市集等各类活动</p>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="total-markets">0</span>
                    <span class="stat-label">个市集活动</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="total-cities">0</span>
                    <span class="stat-label">个城市</span>
                </div>
                <div class="stat">
                    <span class="stat-number">4</span>
                    <span class="stat-label">种类型</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section class="filters container">
        <div class="filter-group">
            <label>📍 地区</label>
            <select id="province-select">
                <option value="">全部省份</option>
            </select>
            <select id="city-select" disabled>
                <option value="">全部城市</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>🏷️ 类型</label>
            <select id="category-select">
                <option value="">全部类型</option>
                <option value="农夫市集">农夫市集</option>
                <option value="创意市集">创意市集</option>
                <option value="复古市集">复古市集</option>
                <option value="美食市集">美食市集</option>
            </select>
        </div>

        <div class="filter-group">
            <label>📅 时间</label>
            <select id="date-select">
                <option value="">全部时间</option>
                <option value="today">今天</option>
                <option value="weekend">本周末</option>
                <option value="month">本月</option>
                <option value="next-month">下个月</option>
            </select>
        </div>

        <div class="filter-group">
            <button id="reset-btn" class="reset-btn">重置筛选</button>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container main-content">
        <div class="results-info">
            <span id="result-count">0</span> 个市集活动
            <span id="active-filters" class="active-filters"></span>
        </div>
        <div class="market-grid" id="market-grid">
            <!-- Cards populated by JS -->
        </div>
        <div class="no-results" id="no-results" style="display: none;">
            <div class="no-results-content">
                <h3>😔 没有找到符合条件的市集活动</h3>
                <p>尝试调整筛选条件，或者查看所有市集</p>
                <button id="view-all-btn" class="view-all-btn">查看所有市集</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>集市指南</h4>
                    <p>发现全国各地精彩市集活动，从农夫市集到创意市集，从复古市集到美食市集，总有一个适合你。</p>
                </div>
                <div class="footer-section">
                    <h4>快速链接</h4>
                    <ul>
                        <li><a href="#" id="footer-home">首页</a></li>
                        <li><a href="mailto:submit@market-guide.com">提交市集</a></li>
                        <li><a href="mailto:contact@market-guide.com">联系我们</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>市集类型</h4>
                    <ul>
                        <li><a href="#" data-category="农夫市集">农夫市集</a></li>
                        <li><a href="#" data-category="创意市集">创意市集</a></li>
                        <li><a href="#" data-category="复古市集">复古市集</a></li>
                        <li><a href="#" data-category="美食市集">美食市集</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 集市指南. 发现身边的美好市集. | 数据来源：公开信息整理</p>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
